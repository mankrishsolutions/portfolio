<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Portfolio Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen p-4 sm:p-6 font-sans transition-colors duration-200">
  <div class="max-w-7xl mx-auto space-y-6">

    <!-- Top Navigation & Controls Bar -->
    <div class="flex flex-wrap items-center justify-between gap-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 shadow-sm">
      <div class="flex items-center gap-3">
        <h1 class="text-lg font-bold tracking-tight">Portfolio Tracker</h1>
        <span class="text-xs px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-300 dark:border-slate-700">
          NIFTY 50: <strong id="idx-nifty" class="text-slate-900 dark:text-slate-200">--</strong>
        </span>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <!-- 1-Second Auto Refresh Toggle -->
        <label class="flex items-center gap-2 text-xs font-medium cursor-pointer bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700/60 px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 select-none">
          <input type="checkbox" id="auto-refresh-toggle" onchange="toggleAutoRefresh(this.checked)" class="rounded text-indigo-600 focus:ring-0">
          <span>Auto-Refresh (1s)</span>
          <span id="refresh-indicator" class="inline-block w-2 h-2 rounded-full bg-slate-400"></span>
        </label>

        <!-- Toggle Add Stock Button -->
        <button onclick="toggleAddStockForm()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-2 rounded-lg text-xs font-semibold shadow transition-colors flex items-center gap-1.5">
          <span id="add-btn-icon">+</span>
          <span id="add-btn-label">Add Stock</span>
        </button>

        <!-- Force Cloud Sync -->
        <button onclick="syncFromCloud()" title="Reload from Cloudflare KV" class="bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 px-3 py-2 rounded-lg text-xs font-semibold transition-colors">
          ☁️ Sync Cloud
        </button>

        <!-- Dark / Light Theme Toggle -->
        <button onclick="toggleTheme()" class="bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 px-3 py-2 rounded-lg text-xs font-semibold transition-colors">
          <span id="theme-icon">☀️ Light</span>
        </button>
      </div>
    </div>

    <!-- Hidden by Default: Add Stock Form -->
    <div id="add-stock-panel" class="hidden bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 shadow-md transition-all">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Add New Position</h2>
        <button onclick="toggleAddStockForm(false)" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xs">✕ Close</button>
      </div>
      <form id="add-stock-form" onsubmit="addStock(event)" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
        <div>
          <input type="text" id="input-symbol" placeholder="Symbol (e.g. RELIANCE, TCS)" required
            class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500 uppercase">
        </div>
        <div>
          <input type="number" id="input-qty" placeholder="Quantity (BQ)" min="1" step="1" required
            class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <input type="number" id="input-price" placeholder="Buy Price (₹)" min="0.01" step="0.01" required
            class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500">
        </div>
        <button type="submit" id="save-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2 rounded-lg text-sm shadow transition-colors">
          Save Position
        </button>
      </form>
    </div>

    <!-- KPI Summary Row -->
    <header class="grid grid-cols-2 md:grid-cols-4 gap-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-5 shadow-sm">
      <div>
        <span class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Total Invested</span>
        <div id="kpi-invested" class="text-xl sm:text-2xl font-bold mt-1 text-slate-900 dark:text-white">₹0.00</div>
      </div>
      <div>
        <span class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Current Value</span>
        <div id="kpi-current" class="text-xl sm:text-2xl font-bold mt-1 text-slate-900 dark:text-white">₹0.00</div>
      </div>
      <div>
        <span class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Total P&L</span>
        <div id="kpi-total-pnl" class="text-xl sm:text-2xl font-bold mt-1 text-slate-400">₹0.00</div>
        <div id="kpi-total-pct" class="text-xs font-medium text-slate-500">0.00%</div>
      </div>
      <div>
        <span class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Today's P&L</span>
        <div id="kpi-today-pnl" class="text-xl sm:text-2xl font-bold mt-1 text-slate-400">₹0.00</div>
        <div id="kpi-prev-close" class="text-xs text-slate-400">Prev Close Total: ₹0.00</div>
      </div>
    </header>

    <!-- Holdings Table -->
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden shadow-sm">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 dark:bg-slate-950/80 border-b border-slate-200 dark:border-slate-800 text-[11px] font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
            <tr>
              <th class="py-3 px-3">#</th>
              <th class="py-3 px-3">Script</th>
              <th class="py-3 px-3 text-right">BQ</th>
              <th class="py-3 px-3 text-right">Buy Price</th>
              <th class="py-3 px-3 text-right">Buy Value</th>
              <th class="py-3 px-3 text-right">LTP</th>
              <th class="py-3 px-3 text-right">Curr Value</th>
              <th class="py-3 px-3 text-right">Total +/-</th>
              <th class="py-3 px-3 text-right">Total %</th>
              <th class="py-3 px-3 text-right">% Today</th>
              <th class="py-3 px-3 text-right">Volume</th>
              <th class="py-3 px-3 text-right">52W High</th>
              <th class="py-3 px-3 text-right">% from 52W H</th>
              <th class="py-3 px-3 text-center">Action</th>
            </tr>
          </thead>
          <tbody id="portfolio-body" class="divide-y divide-slate-100 dark:divide-slate-800/60 font-mono text-xs">
            <!-- Dynamic rows injected here -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const WORKER_BASE = "https://tickerprice.mankrishsolutions.workers.dev";
    const THEME_KEY = "portfolio_theme_mode";

    let holdings = [];
    let isFetching = false;
    let autoRefreshInterval = null;

    // Theme Management
    function initTheme() {
      const savedTheme = localStorage.getItem(THEME_KEY) || "dark";
      if (savedTheme === "dark") {
        document.documentElement.classList.add("dark");
        document.getElementById("theme-icon").innerText = "☀️ Light";
      } else {
        document.documentElement.classList.remove("dark");
        document.getElementById("theme-icon").innerText = "🌙 Dark";
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle("dark");
      localStorage.setItem(THEME_KEY, isDark ? "dark" : "light");
      document.getElementById("theme-icon").innerText = isDark ? "☀️ Light" : "🌙 Dark";
    }

    // Toggle Add Stock Form
    function toggleAddStockForm(forceState) {
      const panel = document.getElementById("add-stock-panel");
      const icon = document.getElementById("add-btn-icon");
      const label = document.getElementById("add-btn-label");
      
      const isHidden = forceState !== undefined ? !forceState : panel.classList.contains("hidden");
      
      if (isHidden) {
        panel.classList.remove("hidden");
        icon.innerText = "✕";
        label.innerText = "Close Form";
        document.getElementById("input-symbol").focus();
      } else {
        panel.classList.add("hidden");
        icon.innerText = "+";
        label.innerText = "Add Stock";
      }
    }

    // Load Holdings from Cloudflare KV
    async function syncFromCloud() {
      try {
        const res = await fetch(`${WORKER_BASE}/holdings?t=${Date.now()}`);
        if (!res.ok) throw new Error("Cloud fetch failed");
        holdings = await res.json();
        refreshAllPrices();
      } catch (err) {
        console.error("Failed to load holdings from Cloud:", err);
      }
    }

    // Save Holdings to Cloudflare KV
    async function saveToCloud(updatedHoldings) {
      try {
        await fetch(`${WORKER_BASE}/holdings`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(updatedHoldings)
        });
      } catch (err) {
        alert("Failed to save to cloud database. Please verify worker KV binding.");
      }
    }

    const fmtInr = (n) => "₹" + Number(n).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmtVol = (n) => n > 100000 ? (n / 100000).toFixed(2) + " L" : Number(n).toLocaleString("en-IN");

    // Fetch quote from Cloudflare Worker
    async function fetchQuote(symbol) {
      try {
        const res = await fetch(`${WORKER_BASE}/?symbol=${encodeURIComponent(symbol)}`);
        if (!res.ok) return null;
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    // Add Stock
    async function addStock(e) {
      e.preventDefault();
      const symInput = document.getElementById("input-symbol");
      const qtyInput = document.getElementById("input-qty");
      const priceInput = document.getElementById("input-price");
      const saveBtn = document.getElementById("save-btn");

      const symbol = symInput.value.trim().toUpperCase();
      const bq = parseFloat(qtyInput.value);
      const price = parseFloat(priceInput.value);

      if (!symbol || isNaN(bq) || isNaN(price)) return;

      saveBtn.innerText = "Saving...";
      saveBtn.disabled = true;

      holdings.push({
        id: Date.now().toString(),
        symbol: symbol,
        bq: bq,
        price: price
      });

      await saveToCloud(holdings);

      symInput.value = "";
      qtyInput.value = "";
      priceInput.value = "";
      saveBtn.innerText = "Save Position";
      saveBtn.disabled = false;
      toggleAddStockForm(false);

      refreshAllPrices();
    }

    // Remove Stock
    async function removeStock(id) {
      holdings = holdings.filter(item => item.id !== id);
      await saveToCloud(holdings);
      refreshAllPrices();
    }

    // Refresh Dashboard Prices
    async function refreshAllPrices() {
      if (isFetching) return;
      isFetching = true;

      const indicator = document.getElementById("refresh-indicator");
      indicator.classList.remove("bg-slate-400");
      indicator.classList.add("bg-emerald-500", "animate-ping");

      const tbody = document.getElementById("portfolio-body");

      if (holdings.length === 0) {
        tbody.innerHTML = `<tr><td colspan="14" class="text-center py-8 text-slate-400 font-sans">No stocks found. Click "+ Add Stock" to start.</td></tr>`;
        updateKPIs(0, 0, 0);
        finishRefresh();
        return;
      }

      fetchQuote("NIFTY_50").then(d => {
        if (d && d.ltp) document.getElementById("idx-nifty").innerText = d.ltp.toLocaleString("en-IN");
      });

      try {
        const quotes = await Promise.all(holdings.map(h => fetchQuote(h.symbol)));

        let totalInvested = 0;
        let totalCurrent = 0;
        let totalPrevClose = 0;
        let rowsHtml = "";

        for (let i = 0; i < holdings.length; i++) {
          const item = holdings[i];
          const quote = quotes[i];

          const ltp = quote?.ltp || item.price;
          const prevClose = quote?.previousClose || ltp;
          const high52 = quote?.high52 || 0;
          const vol = quote?.volume || 0;

          const buyValue = item.bq * item.price;
          const currValue = item.bq * ltp;
          const prevValue = item.bq * prevClose;

          const totalDiff = currValue - buyValue;
          const totalPct = (totalDiff / buyValue) * 100;
          const todayPct = ((ltp - prevClose) / prevClose) * 100;
          const from52Pct = high52 > 0 ? ((ltp - high52) / high52) * 100 : 0;

          totalInvested += buyValue;
          totalCurrent += currValue;
          totalPrevClose += prevValue;

          const totalColor = totalDiff >= 0 ? "text-emerald-500 dark:text-emerald-400" : "text-rose-500 dark:text-rose-400";
          const todayColor = todayPct >= 0 ? "text-emerald-600 dark:text-emerald-400 bg-emerald-100 dark:bg-emerald-950/40" : "text-rose-600 dark:text-rose-400 bg-rose-100 dark:bg-rose-950/40";

          rowsHtml += `
            <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors">
              <td class="py-3 px-3 text-slate-400">${i + 1}</td>
              <td class="py-3 px-3 font-sans font-bold text-slate-800 dark:text-slate-100">${item.symbol}</td>
              <td class="py-3 px-3 text-right text-slate-700 dark:text-slate-300">${item.bq}</td>
              <td class="py-3 px-3 text-right text-slate-700 dark:text-slate-300">${item.price.toFixed(2)}</td>
              <td class="py-3 px-3 text-right text-slate-700 dark:text-slate-300">${fmtInr(buyValue)}</td>
              <td class="py-3 px-3 text-right font-bold text-slate-900 dark:text-white">${ltp.toFixed(2)}</td>
              <td class="py-3 px-3 text-right text-slate-800 dark:text-slate-200 font-semibold">${fmtInr(currValue)}</td>
              <td class="py-3 px-3 text-right font-semibold ${totalColor}">${totalDiff >= 0 ? '+' : ''}${totalDiff.toFixed(2)}</td>
              <td class="py-3 px-3 text-right font-semibold ${totalColor}">${totalPct.toFixed(2)}%</td>
              <td class="py-3 px-3 text-right font-bold rounded ${todayColor}">${todayPct >= 0 ? '+' : ''}${todayPct.toFixed(2)}%</td>
              <td class="py-3 px-3 text-right text-slate-500 dark:text-slate-400">${fmtVol(vol)}</td>
              <td class="py-3 px-3 text-right text-slate-500 dark:text-slate-400">${high52 ? high52.toFixed(2) : '--'}</td>
              <td class="py-3 px-3 text-right ${from52Pct < 0 ? 'text-rose-500 dark:text-rose-400' : 'text-slate-500'}">${from52Pct ? from52Pct.toFixed(2) + '%' : '--'}</td>
              <td class="py-3 px-3 text-center">
                <button onclick="removeStock('${item.id}')" title="Delete" class="text-rose-500 hover:text-rose-700 dark:hover:text-rose-300 p-1 rounded transition">
                  ✕
                </button>
              </td>
            </tr>
          `;
        }

        tbody.innerHTML = rowsHtml;
        updateKPIs(totalInvested, totalCurrent, totalPrevClose);
      } catch (err) {
        console.error("Dashboard update failed", err);
      } finally {
        finishRefresh();
      }
    }

    function finishRefresh() {
      isFetching = false;
      const indicator = document.getElementById("refresh-indicator");
      indicator.classList.remove("bg-emerald-500", "animate-ping");
      indicator.classList.add("bg-slate-400");
    }

    function updateKPIs(invested, current, prevClose) {
      const totalPnl = current - invested;
      const totalPct = invested > 0 ? (totalPnl / invested) * 100 : 0;
      const todayPnl = current - prevClose;

      document.getElementById("kpi-invested").innerText = fmtInr(invested);
      document.getElementById("kpi-current").innerText = fmtInr(current);

      const totalElem = document.getElementById("kpi-total-pnl");
      totalElem.innerText = `${totalPnl >= 0 ? '+' : ''}${fmtInr(totalPnl)}`;
      totalElem.className = `text-xl sm:text-2xl font-bold mt-1 ${totalPnl >= 0 ? 'text-emerald-500 dark:text-emerald-400' : 'text-rose-500 dark:text-rose-400'}`;

      const totalPctElem = document.getElementById("kpi-total-pct");
      totalPctElem.innerText = `${totalPct >= 0 ? '+' : ''}${totalPct.toFixed(2)}% overall`;
      totalPctElem.className = `text-xs font-semibold ${totalPct >= 0 ? 'text-emerald-500 dark:text-emerald-400' : 'text-rose-500 dark:text-rose-400'}`;

      const todayElem = document.getElementById("kpi-today-pnl");
      todayElem.innerText = `${todayPnl >= 0 ? '+' : ''}${fmtInr(todayPnl)}`;
      todayElem.className = `text-xl sm:text-2xl font-bold mt-1 ${todayPnl >= 0 ? 'text-emerald-500 dark:text-emerald-400' : 'text-rose-500 dark:text-rose-400'}`;

      document.getElementById("kpi-prev-close").innerText = `Prev Close Total: ${fmtInr(prevClose)}`;
    }

    // Auto Refresh Controller (1-second tick)
    function toggleAutoRefresh(start) {
      if (start) {
        refreshAllPrices();
        autoRefreshInterval = setInterval(refreshAllPrices, 1000);
      } else {
        if (autoRefreshInterval) clearInterval(autoRefreshInterval);
      }
    }

    // App Initialization
    initTheme();
    syncFromCloud();
  </script>
</body>
</html>
