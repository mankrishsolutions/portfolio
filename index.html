<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Tracker</title>

  <!-- 1. Suppress Tailwind CDN production warning in console -->
  <script>
    const _warn = console.warn;
    console.warn = function(...args) {
      if (typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com should not be used in production')) {
        return;
      }
      _warn.apply(console, args);
    };
  </script>

  <!-- 2. Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>

  <style>
    /* Compact scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #64748b; border-radius: 3px; }
    .th-sort { cursor: pointer; user-select: none; }
    .th-sort:hover { color: #6366f1; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen text-[12px] font-sans transition-colors duration-150 p-2 sm:p-4">

  <div class="max-w-[1550px] mx-auto space-y-2">

    <!-- 1. Ultra-Compact Header & Global Actions Bar -->
    <header class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg px-3 py-2 flex flex-wrap items-center justify-between gap-2 shadow-sm">
      <div class="flex items-center gap-2">
        <h1 class="font-extrabold text-sm tracking-tight">Portfolio</h1>
        <div class="flex items-center gap-1.5 px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-[11px]">
          <span class="text-slate-500">NIFTY:</span>
          <strong id="idx-nifty" class="text-slate-800 dark:text-slate-200">--</strong>
        </div>
      </div>

      <!-- Right Action Controls -->
      <div class="flex items-center gap-1.5">
        <!-- 1s Auto Refresh Checkbox -->
        <label class="flex items-center gap-1 px-2 py-1 rounded bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 cursor-pointer select-none text-[11px]">
          <input type="checkbox" id="auto-refresh-toggle" onchange="toggleAutoRefresh(this.checked)" class="w-3 h-3 text-indigo-600 rounded">
          <span>1s Auto</span>
          <span id="refresh-indicator" class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>
        </label>

        <!-- Add Stock Toggle -->
        <button onclick="toggleAddForm()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-2.5 py-1 rounded text-[11px] flex items-center gap-1 shadow-sm transition">
          <span id="add-btn-icon">+</span> Stock
        </button>

        <!-- Cloud Sync Action -->
        <button onclick="syncFromCloud()" title="Pull fresh positions from Cloudflare KV" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 px-2 py-1 rounded text-[11px] border border-slate-200 dark:border-slate-700 transition">
          ☁️ Sync
        </button>

        <!-- Theme Toggle -->
        <button onclick="toggleTheme()" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 px-2 py-1 rounded text-[11px] border border-slate-200 dark:border-slate-700 transition">
          <span id="theme-icon">☀️</span>
        </button>
      </div>
    </header>

    <!-- 2. Hidden Add Position Bar (Slides open on demand) -->
    <div id="add-form-panel" class="hidden bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg p-3 shadow-md">
      <form onsubmit="addStock(event)" class="grid grid-cols-2 sm:grid-cols-4 gap-2 items-center">
        <input type="text" id="input-symbol" placeholder="SYMBOL (e.g. RELIANCE)" required class="bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 px-2.5 py-1 rounded uppercase text-[11px] focus:outline-none focus:border-indigo-500">
        <input type="number" id="input-qty" placeholder="BQ (Qty)" min="1" step="1" required class="bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 px-2.5 py-1 rounded text-[11px] focus:outline-none focus:border-indigo-500">
        <input type="number" id="input-price" placeholder="Buy Price (₹)" min="0.01" step="0.01" required class="bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 px-2.5 py-1 rounded text-[11px] focus:outline-none focus:border-indigo-500">
        <div class="flex gap-1.5 col-span-2 sm:col-span-1">
          <button type="submit" id="save-btn" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-1 rounded text-[11px] shadow">Save</button>
          <button type="button" onclick="toggleAddForm(false)" class="px-2 py-1 bg-slate-200 dark:bg-slate-800 rounded text-[11px]">Cancel</button>
        </div>
      </form>
    </div>

    <!-- 3. Ultra-Dense KPI Summary Header -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg p-2.5 shadow-sm">
      <div class="border-r border-slate-100 dark:border-slate-800/80 pr-2">
        <div class="text-[10px] uppercase font-bold text-slate-400">Invested</div>
        <div id="kpi-invested" class="font-extrabold text-sm sm:text-base text-slate-900 dark:text-white mt-0.5">₹0.00</div>
      </div>
      <div class="border-r border-slate-100 dark:border-slate-800/80 pr-2">
        <div class="text-[10px] uppercase font-bold text-slate-400">Current Value</div>
        <div id="kpi-current" class="font-extrabold text-sm sm:text-base text-slate-900 dark:text-white mt-0.5">₹0.00</div>
      </div>
      <div class="border-r border-slate-100 dark:border-slate-800/80 pr-2">
        <div class="text-[10px] uppercase font-bold text-slate-400 flex justify-between">
          <span>Total P&L</span>
          <span id="kpi-total-pct" class="font-semibold text-slate-500">0.00%</span>
        </div>
        <div id="kpi-total-pnl" class="font-extrabold text-sm sm:text-base mt-0.5">₹0.00</div>
      </div>
      <div>
        <div class="text-[10px] uppercase font-bold text-slate-400">Today's P&L</div>
        <div id="kpi-today-pnl" class="font-extrabold text-sm sm:text-base mt-0.5">₹0.00</div>
        <div id="kpi-prev-close" class="text-[9px] text-slate-400 truncate">Prev: ₹0.00</div>
      </div>
    </div>

    <!-- 4. Mobile View: Demat App Card Layout (Visible only on < md screens) -->
    <div id="mobile-cards-container" class="md:hidden space-y-1.5">
      <!-- Injected via JavaScript -->
    </div>

    <!-- 5. Desktop View: High-Density Table with Click-to-Sort Headers (Hidden on Mobile) -->
    <div class="hidden md:block bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg overflow-hidden shadow-sm">
      <div class="overflow-x-auto">
        <table class="w-full text-left font-mono text-[11px] border-collapse">
          <thead class="bg-slate-50 dark:bg-slate-950/70 border-b border-slate-200 dark:border-slate-800 text-[10px] text-slate-400 uppercase select-none font-sans">
            <tr>
              <th class="py-1.5 px-2">#</th>
              <th onclick="sortTable('symbol')" class="py-1.5 px-2 th-sort">Script <span id="sort-symbol"></span></th>
              <th onclick="sortTable('bq')" class="py-1.5 px-2 text-right th-sort">BQ <span id="sort-bq"></span></th>
              <th onclick="sortTable('price')" class="py-1.5 px-2 text-right th-sort">Buy Price <span id="sort-price"></span></th>
              <th onclick="sortTable('buyValue')" class="py-1.5 px-2 text-right th-sort">Buy Val <span id="sort-buyValue"></span></th>
              <th onclick="sortTable('ltp')" class="py-1.5 px-2 text-right th-sort">LTP <span id="sort-ltp"></span></th>
              <th onclick="sortTable('currValue')" class="py-1.5 px-2 text-right th-sort">Curr Val <span id="sort-currValue"></span></th>
              <th onclick="sortTable('totalDiff')" class="py-1.5 px-2 text-right th-sort">Total +/- <span id="sort-totalDiff"></span></th>
              <th onclick="sortTable('totalPct')" class="py-1.5 px-2 text-right th-sort">Total % <span id="sort-totalPct"></span></th>
              <th onclick="sortTable('todayPct')" class="py-1.5 px-2 text-right th-sort">% Today <span id="sort-todayPct"></span></th>
              <th onclick="sortTable('vol')" class="py-1.5 px-2 text-right th-sort">Volume <span id="sort-vol"></span></th>
              <th onclick="sortTable('high52')" class="py-1.5 px-2 text-right th-sort">52W H <span id="sort-high52"></span></th>
              <th onclick="sortTable('from52Pct')" class="py-1.5 px-2 text-right th-sort">% 52W <span id="sort-from52Pct"></span></th>
              <th class="py-1.5 px-2 text-center font-sans">Act</th>
            </tr>
          </thead>
          <tbody id="portfolio-body" class="divide-y divide-slate-100 dark:divide-slate-800/60 leading-tight">
            <!-- Dynamic dense rows injected here -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const WORKER_BASE = "https://tickerprice.mankrishsolutions.workers.dev";
    const THEME_KEY = "portfolio_theme_mode";

    let holdings = [];
    let computedData = [];
    let isFetching = false;
    let autoRefreshInterval = null;

    // Sorting state
    let currentSortCol = 'symbol';
    let currentSortAsc = true;

    // Theme Management
    function initTheme() {
      const saved = localStorage.getItem(THEME_KEY) || "dark";
      if (saved === "dark") {
        document.documentElement.classList.add("dark");
        document.getElementById("theme-icon").innerText = "☀️";
      } else {
        document.documentElement.classList.remove("dark");
        document.getElementById("theme-icon").innerText = "🌙";
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle("dark");
      localStorage.setItem(THEME_KEY, isDark ? "dark" : "light");
      document.getElementById("theme-icon").innerText = isDark ? "☀️" : "🌙";
    }

    // Toggle Form visibility
    function toggleAddForm(forceState) {
      const panel = document.getElementById("add-form-panel");
      const icon = document.getElementById("add-btn-icon");
      const isHidden = forceState !== undefined ? !forceState : panel.classList.contains("hidden");

      if (isHidden) {
        panel.classList.remove("hidden");
        icon.innerText = "✕";
        document.getElementById("input-symbol").focus();
      } else {
        panel.classList.add("hidden");
        icon.innerText = "+";
      }
    }

    // Cloud KV Read
    async function syncFromCloud() {
      try {
        const res = await fetch(`${WORKER_BASE}/holdings?t=${Date.now()}`);
        if (!res.ok) throw new Error("Cloud fetch failed");
        holdings = await res.json();
        refreshAllPrices();
      } catch (err) {
        console.error("KV Read Error:", err);
      }
    }

    // Cloud KV Write
    async function saveToCloud(updatedHoldings) {
      try {
        await fetch(`${WORKER_BASE}/holdings`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(updatedHoldings)
        });
      } catch (err) {
        alert("Failed to save holdings to Cloudflare KV.");
      }
    }

    const fmtInr = (n) => "₹" + Number(n).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmtVol = (n) => n > 100000 ? (n / 100000).toFixed(2) + " L" : Number(n).toLocaleString("en-IN");

    // Fetch quote helper
    async function fetchQuote(symbol) {
      try {
        const res = await fetch(`${WORKER_BASE}/?symbol=${encodeURIComponent(symbol)}`);
        if (!res.ok) return null;
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    // Add position
    async function addStock(e) {
      e.preventDefault();
      const symInput = document.getElementById("input-symbol");
      const qtyInput = document.getElementById("input-qty");
      const priceInput = document.getElementById("input-price");
      const saveBtn = document.getElementById("save-btn");

      const symbol = symInput.value.trim().toUpperCase();
      const bq = parseFloat(qtyInput.value);
      const price = parseFloat(priceInput.value);

      if (!symbol || isNaN(bq) || isNaN(price)) return;

      saveBtn.innerText = "...";
      saveBtn.disabled = true;

      holdings.push({
        id: Date.now().toString(),
        symbol: symbol,
        bq: bq,
        price: price
      });

      await saveToCloud(holdings);

      symInput.value = "";
      qtyInput.value = "";
      priceInput.value = "";
      saveBtn.innerText = "Save";
      saveBtn.disabled = false;
      toggleAddForm(false);

      refreshAllPrices();
    }

    // Remove position
    async function removeStock(id) {
      if (!confirm("Delete position?")) return;
      holdings = holdings.filter(item => item.id !== id);
      await saveToCloud(holdings);
      refreshAllPrices();
    }

    // Sort Column Trigger
    function sortTable(column) {
      if (currentSortCol === column) {
        currentSortAsc = !currentSortAsc;
      } else {
        currentSortCol = column;
        currentSortAsc = true;
      }
      renderDashboard();
    }

    // Main Price Sync
    async function refreshAllPrices() {
      if (isFetching) return;
      isFetching = true;

      const indicator = document.getElementById("refresh-indicator");
      indicator.className = "w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping";

      // Background NIFTY quote
      fetchQuote("NIFTY_50").then(d => {
        if (d && d.ltp) document.getElementById("idx-nifty").innerText = d.ltp.toLocaleString("en-IN");
      });

      try {
        const quotes = await Promise.all(holdings.map(h => fetchQuote(h.symbol)));

        computedData = holdings.map((item, idx) => {
          const q = quotes[idx];
          const ltp = q?.ltp || item.price;
          const prevClose = q?.previousClose || ltp;
          const high52 = q?.high52 || 0;
          const vol = q?.volume || 0;

          const buyValue = item.bq * item.price;
          const currValue = item.bq * ltp;
          const prevValue = item.bq * prevClose;

          const totalDiff = currValue - buyValue;
          const totalPct = (totalDiff / buyValue) * 100;
          const todayPct = ((ltp - prevClose) / prevClose) * 100;
          const from52Pct = high52 > 0 ? ((ltp - high52) / high52) * 100 : 0;

          return {
            ...item,
            ltp,
            prevClose,
            high52,
            vol,
            buyValue,
            currValue,
            prevValue,
            totalDiff,
            totalPct,
            todayPct,
            from52Pct
          };
        });

        renderDashboard();
      } catch (err) {
        console.error("Refresh error:", err);
      } finally {
        isFetching = false;
        indicator.className = "w-1.5 h-1.5 rounded-full bg-slate-400";
      }
    }

    // Render Data to Table and Cards
    function renderDashboard() {
      // 1. Sort computed data
      computedData.sort((a, b) => {
        let valA = a[currentSortCol];
        let valB = b[currentSortCol];

        if (typeof valA === "string") {
          return currentSortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
        }
        return currentSortAsc ? valA - valB : valB - valA;
      });

      // 2. Render sorting arrow icons on headers
      const sortHeaders = ['symbol', 'bq', 'price', 'buyValue', 'ltp', 'currValue', 'totalDiff', 'totalPct', 'todayPct', 'vol', 'high52', 'from52Pct'];
      sortHeaders.forEach(col => {
        const span = document.getElementById(`sort-${col}`);
        if (span) {
          span.innerText = currentSortCol === col ? (currentSortAsc ? '↑' : '↓') : '';
        }
      });

      let totalInvested = 0;
      let totalCurrent = 0;
      let totalPrevClose = 0;

      let desktopHtml = "";
      let mobileHtml = "";

      computedData.forEach((item, i) => {
        totalInvested += item.buyValue;
        totalCurrent += item.currValue;
        totalPrevClose += item.prevValue;

        const isPositive = item.totalDiff >= 0;
        const isTodayPos = item.todayPct >= 0;

        const totalColor = isPositive ? "text-emerald-500 dark:text-emerald-400" : "text-rose-500 dark:text-rose-400";
        const todayBadge = isTodayPos 
          ? "text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/40" 
          : "text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40";

        // Desktop Row (Ultra Dense)
        desktopHtml += `
          <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
            <td class="py-1.5 px-2 text-slate-400 text-[10px]">${i + 1}</td>
            <td class="py-1.5 px-2 font-sans font-bold text-slate-900 dark:text-slate-100">${item.symbol}</td>
            <td class="py-1.5 px-2 text-right text-slate-600 dark:text-slate-300">${item.bq}</td>
            <td class="py-1.5 px-2 text-right text-slate-600 dark:text-slate-300">${item.price.toFixed(2)}</td>
            <td class="py-1.5 px-2 text-right text-slate-600 dark:text-slate-300">${fmtInr(item.buyValue)}</td>
            <td class="py-1.5 px-2 text-right font-bold text-slate-900 dark:text-white">${item.ltp.toFixed(2)}</td>
            <td class="py-1.5 px-2 text-right font-semibold text-slate-800 dark:text-slate-200">${fmtInr(item.currValue)}</td>
            <td class="py-1.5 px-2 text-right font-semibold ${totalColor}">${isPositive ? '+' : ''}${item.totalDiff.toFixed(2)}</td>
            <td class="py-1.5 px-2 text-right font-semibold ${totalColor}">${item.totalPct.toFixed(2)}%</td>
            <td class="py-1.5 px-2 text-right font-bold ${todayBadge} px-1 rounded">${isTodayPos ? '+' : ''}${item.todayPct.toFixed(2)}%</td>
            <td class="py-1.5 px-2 text-right text-slate-500 dark:text-slate-400">${fmtVol(item.vol)}</td>
            <td class="py-1.5 px-2 text-right text-slate-500 dark:text-slate-400">${item.high52 ? item.high52.toFixed(2) : '--'}</td>
            <td class="py-1.5 px-2 text-right ${item.from52Pct < 0 ? 'text-rose-400' : 'text-slate-400'}">${item.from52Pct ? item.from52Pct.toFixed(2) + '%' : '--'}</td>
            <td class="py-1.5 px-2 text-center font-sans">
              <button onclick="removeStock('${item.id}')" title="Delete" class="text-rose-500 hover:text-rose-700 dark:hover:text-rose-300 px-1">✕</button>
            </td>
          </tr>
        `;

        // Mobile Card (Direct Demat / Kite layout from your screenshot)
        mobileHtml += `
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg p-2.5 shadow-sm space-y-1">
            <div class="flex items-center justify-between text-[11px]">
              <span class="text-slate-500 dark:text-slate-400">Qty. ${item.bq} • Avg. ${item.price.toFixed(2)}</span>
              <span class="font-bold text-[11px] ${totalColor}">${isPositive ? '+' : ''}${item.totalPct.toFixed(2)}%</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="font-extrabold text-sm text-slate-900 dark:text-white">${item.symbol}</span>
              <span class="font-extrabold text-sm ${totalColor}">${isPositive ? '+' : ''}${fmtInr(item.totalDiff)}</span>
            </div>
            <div class="flex items-center justify-between text-[11px] pt-0.5 border-t border-slate-100 dark:border-slate-800/80">
              <span class="text-slate-400">Invested ${fmtInr(item.buyValue)}</span>
              <div class="flex items-center gap-1.5">
                <span class="font-bold text-slate-800 dark:text-slate-200">LTP ${item.ltp.toFixed(2)}</span>
                <span class="text-[10px] font-semibold ${isTodayPos ? 'text-emerald-500' : 'text-rose-500'}">(${isTodayPos ? '+' : ''}${item.todayPct.toFixed(2)}%)</span>
                <button onclick="removeStock('${item.id}')" class="text-rose-400 hover:text-rose-600 pl-1 text-xs">✕</button>
              </div>
            </div>
          </div>
        `;
      });

      document.getElementById("portfolio-body").innerHTML = desktopHtml || `<tr><td colspan="14" class="text-center py-4 text-slate-400">No positions found.</td></tr>`;
      document.getElementById("mobile-cards-container").innerHTML = mobileHtml || `<div class="text-center py-4 text-slate-400">No positions found.</div>`;

      updateKPIs(totalInvested, totalCurrent, totalPrevClose);
    }

    // Update KPI Numbers
    function updateKPIs(invested, current, prevClose) {
      const totalPnl = current - invested;
      const totalPct = invested > 0 ? (totalPnl / invested) * 100 : 0;
      const todayPnl = current - prevClose;

      document.getElementById("kpi-invested").innerText = fmtInr(invested);
      document.getElementById("kpi-current").innerText = fmtInr(current);

      const totalElem = document.getElementById("kpi-total-pnl");
      totalElem.innerText = `${totalPnl >= 0 ? '+' : ''}${fmtInr(totalPnl)}`;
      totalElem.className = `font-extrabold text-sm sm:text-base mt-0.5 ${totalPnl >= 0 ? 'text-emerald-500 dark:text-emerald-400' : 'text-rose-500 dark:text-rose-400'}`;

      const totalPctElem = document.getElementById("kpi-total-pct");
      totalPctElem.innerText = `${totalPct >= 0 ? '+' : ''}${totalPct.toFixed(2)}%`;
      totalPctElem.className = `text-[10px] font-bold ${totalPct >= 0 ? 'text-emerald-500 dark:text-emerald-400' : 'text-rose-500 dark:text-rose-400'}`;

      const todayElem = document.getElementById("kpi-today-pnl");
      todayElem.innerText = `${todayPnl >= 0 ? '+' : ''}${fmtInr(todayPnl)}`;
      todayElem.className = `font-extrabold text-sm sm:text-base mt-0.5 ${todayPnl >= 0 ? 'text-emerald-500 dark:text-emerald-400' : 'text-rose-500 dark:text-rose-400'}`;

      document.getElementById("kpi-prev-close").innerText = `Prev: ${fmtInr(prevClose)}`;
    }

    // Auto-refresh tick
    function toggleAutoRefresh(start) {
      if (start) {
        refreshAllPrices();
        autoRefreshInterval = setInterval(refreshAllPrices, 1000);
      } else {
        if (autoRefreshInterval) clearInterval(autoRefreshInterval);
      }
    }

    // Initialize
    initTheme();
    syncFromCloud();
  </script>
</body>
</html>
