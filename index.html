<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Stock Portfolio Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-6 font-sans">
  <div class="max-w-7xl mx-auto space-y-6">

    <!-- KPI Summary Header -->
    <header class="grid grid-cols-2 md:grid-cols-5 gap-4 bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg">
      <div>
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Invested</span>
        <div id="kpi-invested" class="text-xl sm:text-2xl font-bold text-white mt-1">₹0.00</div>
      </div>
      <div>
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Current Value</span>
        <div id="kpi-current" class="text-xl sm:text-2xl font-bold text-white mt-1">₹0.00</div>
      </div>
      <div>
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total P&L</span>
        <div id="kpi-total-pnl" class="text-xl sm:text-2xl font-bold text-slate-300 mt-1">₹0.00</div>
        <div id="kpi-total-pct" class="text-xs font-medium text-slate-400">0.00%</div>
      </div>
      <div>
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Today's P&L</span>
        <div id="kpi-today-pnl" class="text-xl sm:text-2xl font-bold text-slate-300 mt-1">₹0.00</div>
        <div id="kpi-prev-close" class="text-xs text-slate-500">Prev Close Total: ₹0.00</div>
      </div>
      <div class="flex flex-col justify-between items-start md:items-end col-span-2 md:col-span-1">
        <div class="text-xs bg-slate-950/80 border border-slate-800 px-3 py-1.5 rounded-lg w-full md:w-auto text-left md:text-right">
          <span class="text-slate-400">NIFTY 50:</span> <span id="idx-nifty" class="font-bold text-slate-200">--</span>
        </div>
        <button onclick="refreshAllPrices()" class="w-full md:w-auto mt-2 bg-indigo-600 hover:bg-indigo-500 transition-colors text-white px-4 py-2 rounded-lg text-sm font-semibold shadow">
          Refresh Live Prices
        </button>
      </div>
    </header>

    <!-- Add New Stock Input Bar -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-md">
      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Add Stock to Portfolio</h2>
      <form id="add-stock-form" onsubmit="addStock(event)" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
        <div>
          <input type="text" id="input-symbol" placeholder="Symbol (e.g. HBLENGINE, RELIANCE)" required
            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 uppercase">
        </div>
        <div>
          <input type="number" id="input-qty" placeholder="Quantity (e.g. 70)" min="1" step="1" required
            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <input type="number" id="input-price" placeholder="Buy Price (e.g. 412.57)" min="0.01" step="0.01" required
            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
        <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 transition-colors text-white font-medium px-4 py-2 rounded-lg text-sm shadow">
          + Add Stock
        </button>
      </form>
    </div>

    <!-- Holdings Table -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-950/80 border-b border-slate-800 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
            <tr>
              <th class="py-3 px-3">SL</th>
              <th class="py-3 px-3">Script</th>
              <th class="py-3 px-3 text-right">BQ</th>
              <th class="py-3 px-3 text-right">Buy Price</th>
              <th class="py-3 px-3 text-right">Buy Value</th>
              <th class="py-3 px-3 text-right">LTP</th>
              <th class="py-3 px-3 text-right">Curr Value</th>
              <th class="py-3 px-3 text-right">Total +/-</th>
              <th class="py-3 px-3 text-right">Total %</th>
              <th class="py-3 px-3 text-right">% Today</th>
              <th class="py-3 px-3 text-right">Volume</th>
              <th class="py-3 px-3 text-right">52W High</th>
              <th class="py-3 px-3 text-right">% from 52W H</th>
              <th class="py-3 px-3 text-center">Action</th>
            </tr>
          </thead>
          <tbody id="portfolio-body" class="divide-y divide-slate-800/60 font-mono text-xs">
            <!-- Dynamic rows injected here -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // 1. Point to your working Cloudflare Worker URL
    const WORKER_BASE = "https://tickerprice.mankrishsolutions.workers.dev/";

    // Default seed data if browser storage is empty
    const initialHoldings = [
      { id: "1", symbol: "HBLENGINE", bq: 70, price: 412.57 },
      { id: "2", symbol: "DHOOTTRANS", bq: 7, price: 871.00 }
    ];

    // Load or initialize holdings from browser localStorage
    function getStoredHoldings() {
      const data = localStorage.getItem("my_portfolio_holdings");
      if (!data) {
        localStorage.setItem("my_portfolio_holdings", JSON.stringify(initialHoldings));
        return initialHoldings;
      }
      return JSON.parse(data);
    }

    function saveStoredHoldings(data) {
      localStorage.setItem("my_portfolio_holdings", JSON.stringify(data));
    }

    const fmtInr = (n) => "₹" + Number(n).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmtVol = (n) => n > 100000 ? (n / 100000).toFixed(2) + " L" : Number(n).toLocaleString("en-IN");

    // Fetch quote from Cloudflare Worker
    async function fetchQuote(symbol) {
      try {
        const res = await fetch(`${WORKER_BASE}/?symbol=${encodeURIComponent(symbol)}`);
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    // Add Stock
    function addStock(e) {
      e.preventDefault();
      const symInput = document.getElementById("input-symbol");
      const qtyInput = document.getElementById("input-qty");
      const priceInput = document.getElementById("input-price");

      const symbol = symInput.value.trim().toUpperCase();
      const bq = parseFloat(qtyInput.value);
      const price = parseFloat(priceInput.value);

      if (!symbol || isNaN(bq) || isNaN(price)) return;

      const holdings = getStoredHoldings();
      holdings.push({
        id: Date.now().toString(),
        symbol: symbol,
        bq: bq,
        price: price
      });

      saveStoredHoldings(holdings);

      // Reset form
      symInput.value = "";
      qtyInput.value = "";
      priceInput.value = "";

      refreshAllPrices();
    }

    // Remove Stock
    function removeStock(id) {
      let holdings = getStoredHoldings();
      holdings = holdings.filter(item => item.id !== id);
      saveStoredHoldings(holdings);
      refreshAllPrices();
    }

    // Refresh and re-render the dashboard
    async function refreshAllPrices() {
      const tbody = document.getElementById("portfolio-body");
      const holdings = getStoredHoldings();

      if (holdings.length === 0) {
        tbody.innerHTML = `<tr><td colspan="14" class="text-center py-8 text-slate-500 font-sans">No holdings added yet. Add a stock using the form above.</td></tr>`;
        updateKPIs(0, 0, 0);
        return;
      }

      tbody.innerHTML = `<tr><td colspan="14" class="text-center py-8 text-indigo-400 font-sans animate-pulse">Updating live market prices...</td></tr>`;

      // Fetch Nifty quote in the background
      fetchQuote("NIFTY_50").then(d => {
        if (d && d.ltp) document.getElementById("idx-nifty").innerText = d.ltp.toLocaleString("en-IN");
      });

      let totalInvested = 0;
      let totalCurrent = 0;
      let totalPrevClose = 0;
      let rowsHtml = "";

      for (let i = 0; i < holdings.length; i++) {
        const item = holdings[i];
        const quote = await fetchQuote(item.symbol);

        const ltp = quote?.ltp || item.price;
        const prevClose = quote?.previousClose || ltp;
        const high52 = quote?.high52 || 0;
        const vol = quote?.volume || 0;

        const buyValue = item.bq * item.price;
        const currValue = item.bq * ltp;
        const prevValue = item.bq * prevClose;

        const totalDiff = currValue - buyValue;
        const totalPct = (totalDiff / buyValue) * 100;
        const todayPct = ((ltp - prevClose) / prevClose) * 100;
        const from52Pct = high52 > 0 ? ((ltp - high52) / high52) * 100 : 0;

        totalInvested += buyValue;
        totalCurrent += currValue;
        totalPrevClose += prevValue;

        const totalColor = totalDiff >= 0 ? "text-emerald-400" : "text-rose-400";
        const todayColor = todayPct >= 0 ? "text-emerald-400 bg-emerald-950/40" : "text-rose-400 bg-rose-950/40";

        rowsHtml += `
          <tr class="hover:bg-slate-800/40 transition-colors">
            <td class="py-3 px-3 text-slate-400">${i + 1}</td>
            <td class="py-3 px-3 font-sans font-bold text-slate-100">${item.symbol}</td>
            <td class="py-3 px-3 text-right text-slate-300">${item.bq}</td>
            <td class="py-3 px-3 text-right text-slate-300">${item.price.toFixed(2)}</td>
            <td class="py-3 px-3 text-right text-slate-300">${fmtInr(buyValue)}</td>
            <td class="py-3 px-3 text-right font-bold text-white">${ltp.toFixed(2)}</td>
            <td class="py-3 px-3 text-right text-slate-200 font-semibold">${fmtInr(currValue)}</td>
            <td class="py-3 px-3 text-right font-semibold ${totalColor}">${totalDiff >= 0 ? '+' : ''}${totalDiff.toFixed(2)}</td>
            <td class="py-3 px-3 text-right font-semibold ${totalColor}">${totalPct.toFixed(2)}%</td>
            <td class="py-3 px-3 text-right font-bold rounded ${todayColor}">${todayPct >= 0 ? '+' : ''}${todayPct.toFixed(2)}%</td>
            <td class="py-3 px-3 text-right text-slate-400">${fmtVol(vol)}</td>
            <td class="py-3 px-3 text-right text-slate-400">${high52 ? high52.toFixed(2) : '--'}</td>
            <td class="py-3 px-3 text-right ${from52Pct < 0 ? 'text-rose-400' : 'text-slate-300'}">${from52Pct ? from52Pct.toFixed(2) + '%' : '--'}</td>
            <td class="py-3 px-3 text-center">
              <button onclick="removeStock('${item.id}')" title="Delete" class="text-rose-400 hover:text-rose-300 hover:bg-rose-950/50 p-1.5 rounded transition">
                ✕
              </button>
            </td>
          </tr>
        `;
      }

      tbody.innerHTML = rowsHtml;
      updateKPIs(totalInvested, totalCurrent, totalPrevClose);
    }

    function updateKPIs(invested, current, prevClose) {
      const totalPnl = current - invested;
      const totalPct = invested > 0 ? (totalPnl / invested) * 100 : 0;
      const todayPnl = current - prevClose;

      document.getElementById("kpi-invested").innerText = fmtInr(invested);
      document.getElementById("kpi-current").innerText = fmtInr(current);

      // Total P&L
      const totalElem = document.getElementById("kpi-total-pnl");
      totalElem.innerText = `${totalPnl >= 0 ? '+' : ''}${fmtInr(totalPnl)}`;
      totalElem.className = `text-xl sm:text-2xl font-bold mt-1 ${totalPnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;

      const totalPctElem = document.getElementById("kpi-total-pct");
      totalPctElem.innerText = `${totalPct >= 0 ? '+' : ''}${totalPct.toFixed(2)}% overall`;
      totalPctElem.className = `text-xs font-semibold ${totalPct >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;

      // Today's P&L
      const todayElem = document.getElementById("kpi-today-pnl");
      todayElem.innerText = `${todayPnl >= 0 ? '+' : ''}${fmtInr(todayPnl)}`;
      todayElem.className = `text-xl sm:text-2xl font-bold mt-1 ${todayPnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;

      document.getElementById("kpi-prev-close").innerText = `Prev Close Total: ${fmtInr(prevClose)}`;
    }

    // Initial load
    refreshAllPrices();
  </script>
</body>
</html>
